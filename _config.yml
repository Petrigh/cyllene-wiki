# ---- Site identity -----------------------------------------------------
title: Cyllene
description: Campaign wiki for a Dungeons & Dragons 5e
# If you publish at https://USER.github.io/REPO/ set baseurl to /REPO
baseurl: "/cyllene-wiki"
url: ""

# ---- Theme -------------------------------------------------------------
# just-the-docs gives a sidebar, breadcrumbs and instant search.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

search_enabled: true
search:
  heading_level: 1
  previews: 1
heading_anchors: true
color_scheme: campaign          # defined in assets/css/just-the-docs-custom.scss

aux_links:
  Edit on GitHub: https://github.com/Petrigh/cyllene-wiki

# ---- Behaviour ---------------------------------------------------------
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Everything below is kept OUT of the published site.
# dm/ holds spoilers. GitHub Pages sites are PUBLIC unless you pay for
# private Pages, so leave dm/ excluded unless the repo itself is private.
exclude:
  - dm/
  - notion-csv/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - templates
