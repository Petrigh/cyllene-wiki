# ---- Site identity -----------------------------------------------------
title: Cyllene
description: Campaign wiki for a Dungeons & Dragons 5e
# If you publish at https://USER.github.io/REPO/ set baseurl to /REPO
baseurl: "/cyllene-wiki"
url: ""

# ---- Theme -------------------------------------------------------------
# just-the-docs gives a sidebar, breadcrumbs and instant search.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

# Bloque "Mencionado en" al pie de cada pagina (_includes/backlinks.html).
# Cruza todas las paginas contra todas, asi que cuesta ~40s de build. En false
# se apaga en todo el sitio: conviene para las tandas largas de escritura, donde
# `jekyll serve` rehace todo en cada guardado. Acordarse de volverlo a true.
backlinks: true

# Mini grafo de conexiones al pie de cada pagina (_includes/page_graph.html).
# A diferencia de backlinks, este no cuesta build: se dibuja en el browser a
# partir de assets/graph-data.json. En false se apaga en todo el sitio; en una
# pagina suelta, `graph: false` en su front matter.
graph: true

# El "hoy" del mundo, en DF (ver lore/calendario.md). Lo usa
# _includes/timeline.html para clavar el hito de Actualidad en la linea de
# tiempo. Va aca y no como un evento mas porque se mueve con la campaña:
# avanzar el calendario tiene que ser esta linea, no una caceria de front
# matter. 780 DF = 503 DC = 11662 Aureo.
today_df: 780

# Tarjeta de preview al pasar el mouse por un link del cuerpo
# (_includes/link_preview.html). Como el grafo, no cuesta build: los datos
# salen de assets/preview-data.json y todo el trabajo pasa en el browser.
# En false se apaga en todo el sitio; en una pagina suelta, `link_previews:
# false` en su front matter; en un link suelto, {:data-no-preview=""}.
link_previews: true

# Boton 2D/3D en el mapa de la home (_includes/campaign_map.html). La vista 3D
# dibuja el mapa como TERRENO: una malla desplazada segun assets/img/map-height.png
# --que genera tools/make_heightmap.py a partir de la acuarela-- con luz, agua y
# camara que orbita. Tampoco cuesta build, y ademas no cuesta NADA a quien no la
# usa: three.js (~650 KB) se baja recien cuando alguien aprieta el boton.
# En false desaparece el boton y queda solo el mapa plano de Leaflet. Sin WebGL
# el boton tampoco aparece, y ?pick siempre fuerza la vista 2D.
map_3d: true

# Con que vista abre el mapa la PRIMERA visita. Despues manda lo que el lector
# haya elegido con el boton, que se guarda en su localStorage.
# Arranca en 2D a proposito: es la vista liviana y probada, y el 3D se estrena
# como algo que se elige. Para invertirlo alcanza con esta linea.
map_3d_default: true

# Exageracion vertical del terreno, como fraccion de la profundidad del mapa.
# El relieve real de un continente es invisible a esta escala; esto es licencia
# poetica y se sube hasta que se vea bien. Mas alto tambien deforma mas los
# nombres pintados sobre map.jpg, asi que si todavia no existe map-clean.jpg
# conviene no pasarse.
map_3d_relief: 0.12

# Radio, en pixeles de map-height.png, con el que se difumina el heightmap
# antes de levantar la malla. La acuarela se pinta con brochazos planos y deja
# mesetas: sin esto la costa es un acantilado vertical y las sierras son cajas.
# Subirlo tiende las laderas, pero tambien achata los picos angostos.
#   0 = crudo, 3 = apenas, 6 = por defecto, 12+ = colinas suaves
map_3d_smooth: 0

# Piso de apariciones para que una entidad pueda SER la respuesta del acertijo
# diario (cylledle.md / _includes/cylledle.html). Una entidad "aparece" en una
# sesion cuando el texto de esa sesion la enlaza; la cuenta la deriva el juego
# de assets/graph-data.json, no hay nada que escribir a mano.
#
# No achica el buscador: como intento siempre vale cualquier entidad. Solo
# achica el conjunto de respuestas posib2les.
#
#   0 -> 160 respuestas   (el pool entero; 36 de ellas no aparecen en ninguna
#                          sesion todavia, asi que esos dias salen con las dos
#                          columnas derivadas vacias y son muy dificiles)
#   1 -> 124 respuestas   (solo lo que la campaña ya toco)
#   2 ->  57 respuestas
#   3 ->  31 respuestas   (los sospechosos de siempre)
#
# Si los dias se vuelven injustos, subir esto es la unica perilla que hace
# falta. Recontar despues de escribir sesiones nuevas: el pool crece solo.
cylledle_min_sessions: 0

search_enabled: true
search:
  heading_level: 1
  previews: 1
heading_anchors: true
color_scheme: campaign          # defined in assets/css/just-the-docs-custom.scss

aux_links:
  Edit on GitHub: https://github.com/Petrigh/cyllene-wiki

# ---- Behaviour ---------------------------------------------------------
defaults:
  # wiki_base es una capa fina sobre el `default` del tema: lo unico que agrega
  # es el bloque de backlinks al pie (ver _layouts/wiki_base.html). Se pone acá,
  # en el scope de todo el sitio, para que lo reciban tambien las secciones sin
  # ficha -- sessions, quests, lore, bestiary, rules.
  - scope:
      path: ""
    values:
      layout: wiki_base
  # Estas secciones llevan la ficha de la derecha (imagen + datos rapidos).
  # Es un layout y no un include para no tener que tocar los ~130 .md sueltos.
  # `card_images` es la carpeta donde la ficha busca la imagen de la pagina,
  # matcheando por nombre de archivo (ver _includes/wiki_card.html).
  - scope:
      path: "characters"
    values:
      layout: wiki
      card_images: /assets/pjs/
  - scope:
      path: "locations"
    values:
      layout: wiki
      card_images: /assets/img/
  - scope:
      path: "factions"
    values:
      layout: wiki
      card_images: /assets/img/
  - scope:
      path: "items"
    values:
      layout: wiki
      card_images: /assets/img/

# ---- TRIPWIRE ----------------------------------------------------------
# Este archivo es el UNICO que lee GitHub Pages. La pagina de salud del wiki
# vive en _meta/ y es local: no se publica porque Jekyll ignora toda carpeta
# que empiece con "_" salvo que una coleccion la nombre, y esa declaracion esta
# solo en _config_local.yml.
#
# Por eso aca NO puede aparecer nunca `collections:` ni `include:`: son las dos
# unicas claves capaces de sacar _meta/ del filtro y subirlo a produccion.
#
#     grep -nE "^(collections|include):" _config.yml   # tiene que dar vacio
#
# Tampoco hace falta agregar _meta/ al `exclude:` de abajo "por las dudas":
# funcionaria, pero para desactivarlo localmente habria que repetir el array
# exclude entero en _config_local.yml (Jekyll reemplaza arrays, no los fusiona)
# y ahi si se romperia algo de verdad.

# Everything below is kept OUT of the published site.
# dm/ holds spoilers. GitHub Pages sites are PUBLIC unless you pay for
# private Pages, so leave dm/ excluded unless the repo itself is private.
exclude:
  - dm/
  # Herramienta de autor, no parte del sitio: genera assets/img/map-height.png
  # a partir de la acuarela. Su salida SI se publica; el script no.
  - tools/
  - notion-csv/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - templates
  - Dockerfile
  - docker-compose.yml
  - .dockerignore
